# wrayth terminal.
#
# Colours are generated per profile by ~/.local/bin/wrayth-profile and
# included below; that script also sends SIGUSR1 so live windows re-read them.

include wrayth-colors.conf

font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
font_size        11.0

# Panel-like inner spacing, so text sits away from the edges.
#
# **The air above the text reads the same as the air beside it, and the two
# were made equal by measuring the ink rather than by matching the numbers.**
#
# The padding is in *points*: 20pt renders as 25 px here. With all four at 20
# the ink came out at **30 px on the left and 28 px on the top** -- not equal,
# because the left gap picks up 5 px of the prompt's opening `[` side bearing
# while the top picks up only 3 px of the font's internal leading above the
# cap. Two more pixels on the top is 1.6pt, so the top is **21.6**. Measured
# on screen at both: **30 px and 30 px.**
#
# **The reference on the left is the prompt's `[`**, because that is what is
# on screen on nearly every row. A line starting on a glyph with no side
# bearing sits about 4 px further left than the bracket does; there is no one
# number that is right for every glyph, and the prompt is the one to match.
#
# It was 0 on top before, for a reason worth keeping: a gap here costs rows.
# The deck terminal went from 32 to **30**. The greeting block is 23 rows and
# the small-logo fallback triggers at 16, so there is room -- but if either
# grows, this is the first place to look.
# The cell grid is pinned to the top-left, so the leftover pixels from a window
# width that is not a whole number of cells all go to the right and bottom
# edges. kitty's default is `center`, which splits them: on a 943 px window with
# a 9 px cell that left a 3 px strip down the left edge, painted with
# tab_bar_margin_color, showing as a grey gap between the window's border and
# the red TTY block.
placement_strategy      top-left

window_padding_width    21.6 20 20 20
confirm_os_window_close 0
enable_audio_bell       no

# --- Header strip ----------------------------------------------------------
# Drawn by ~/.config/kitty/tab_bar.py: the slanted accent TTY.nn tab, then
# "bash // <cwd>" in dim, then the katakana hard right. The 1pt margin below is
# filled with tab_bar_background, which wrayth-profile sets to the profile's
# `hair` -- that is the hairline under the strip.
tab_bar_edge            top
tab_bar_style           custom
tab_bar_min_tabs        1
# The 1pt bottom margin is *not* the strip's line -- tab_bar_margin_color is
# `none`, so this is painted with the default background and is simply a 1 px
# gap between the strip and the terminal's first row. The line itself is a
# per-cell underline drawn by tab_bar.py (accent under the block, hair under
# the rest); see SPEC.md's header strip decisions.
tab_bar_margin_height   0.0 1.0
tab_bar_margin_width    0.0
active_tab_font_style   bold
inactive_tab_font_style normal

# The window frame -- 1px hairline border in the profile colour and the
# four-corner chamfers -- is Hyprland's, from step 16. kitty draws none itself.

cursor_shape            block
cursor_blink_interval   0

# The header strip's line is a cell underline, so it is pushed to the cell's
# last pixel row. **The value is tied to the cell height**, measured from the
# baseline: 3 is the last row of the default 20 px cell. It was 2 while
# `cell_height +4px` was in force and the cell was 24 px; with that gone it is
# back to 3. At the font's own position the line sat mid-cell and cut through
# the red TTY block. The thickness has to be a percentage: `50%` gives 1 px
# where an absolute `1px` renders two rows. This also moves underlined text in
# the terminal, which is the cost.
modify_font underline_position 3
modify_font underline_thickness 50%

# ~~`modify_font cell_height +4px`~~ is gone. It bought the header strip 7 px of
# room above and below its text instead of 5, and charged *every row in the
# terminal* for it -- and the deck emblem, which is drawn on the character grid,
# came out vertically stretched. Standard line spacing is worth more than two
# pixels of strip padding.
