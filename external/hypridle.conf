# wrayth idle behaviour.
#
# Timings come from the spec's Idle behaviour table. Locking goes through the
# shell's own lockscreen over IPC, not hyprlock.
#
# Hyprland here is configured in Lua, so dispatches are Lua expressions --
# `hyprctl dispatch dpms off` does not work, `hl.dsp.dpms({action = "off"})`
# does.
#
# Keep Awake in the bar holds a Wayland idle inhibitor against the bar surface.
# Hyprland stops reporting idle while it is held, so none of these listeners
# fire. It deliberately does not affect the lid: logind handles that.

general {
    lock_cmd = qs -c wrayth ipc call lock lock
    # Anything that suspends locks first.
    before_sleep_cmd = qs -c wrayth ipc call lock lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 5 min: dim the backlight, restore it on any input.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

# 10 min: lock.
listener {
    timeout = 600
    on-timeout = qs -c wrayth ipc call lock lock
}

# 12 min: screen off, back on with any input.
listener {
    timeout = 720
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 min: sleep, on AC and on battery alike.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
