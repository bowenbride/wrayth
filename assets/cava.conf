# Read by services/Cava.qml. Raw ascii on stdout: one line per frame, `bars`
# values of 0 to 100 separated by semicolons. The shell parses that directly --
# binary would not survive being collected as text.

[input]
# **The output monitor, never a capture device or an app's stream.** The
# shell must never read microphone audio. cava starts unlinked
# (node.autoconnect=false, set by services/Cava.qml) and assets/cava-link.py
# links it to the default sink's monitor ports only, following the default
# sink; `source` is not what decides it.
method = pipewire
source = auto

[general]
framerate = 60
# One cava bar per bar on screen. Nothing re-bins in the shell, so no detail is
# averaged away between here and the panel.
bars = 48
autosens = 1
# The full audible range. At 50 to 12000 a 60 Hz tone landed on bar 2, jammed
# against the left edge, and the top three bars never moved at all; over the
# full range the same tone sits on bar 7 and the spectrum uses its whole width.
lower_cutoff_freq = 20
higher_cutoff_freq = 20000

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
# **`stereo` is cava's default and it mirrors: "both channels with low
# frequencies in center".** Left unset, the 48 bars on screen carried only 24
# distinct bands, each drawn twice -- measured, the two strongest separated
# bars correlated at +1.000, because they were the same band. `mono` gives 48
# bands across 48 bars.
channels = mono
mono_option = average

[smoothing]
# noise_reduction is an int 0-100 here, not a 0-1 factor: 0 is "fast but noisy"
# and 100 is very slow. Tuned by hit count against a synthetic signal with bass
# hits at 2 Hz and treble at 3 Hz over 7 seconds, which should read 14 and 21
# peaks: at 10 the bars report 14 and 22, at 20 it is 13 and 22, and by 30 the
# bass collapses to 3 as the hits merge into each other.
noise_reduction = 10
# **Off.** monstercat is a spatial filter relating each bar to its neighbours,
# and it was the other half of the uniformity: adjacent-bar correlation
# measured +0.968 with it on against +0.708 with it off, and it smeared a pure
# tone across about eight bars instead of two. It was here so the temporal
# smoothing could stay low; with the mirroring gone it buys blur, not stability.
monstercat = 0
waves = 0
